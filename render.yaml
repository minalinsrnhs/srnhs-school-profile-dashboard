services:
  - type: web
    name: srnhs-minalin-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_BACKEND
        value: supabase
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: FIRST_ACCOUNT_NAME
        value: SRNHS Admin
      - key: FIRST_ACCOUNT_USERNAME
        value: admin
      - key: FIRST_ACCOUNT_PASSWORD
        sync: false
